<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Mock Facebook Post — FNK test</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 24px auto;
        background: #f0f2f5;
      }
      .post {
        background: #fff;
        border-radius: 8px;
        padding: 16px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }
      .comment {
        margin: 12px 0;
        padding: 8px;
        border-left: 3px solid #1877f2;
      }
      .author {
        font-weight: 700;
        color: #050505;
        text-decoration: none;
      }
      button {
        margin: 8px 4px 0 0;
      }
      #log {
        white-space: pre-wrap;
        background: #1c1e21;
        color: #eee;
        padding: 12px;
        border-radius: 8px;
        margin-top: 16px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="post" role="article" aria-label="Post">
      <h2>Postingan contoh</h2>
      <p>Isi postingan dummy untuk uji selector.</p>

      <div class="comment" role="article" aria-label="Comment by Budi Santoso">
        <a class="author" role="link" href="https://www.facebook.com/budi.s"
          >Budi Santoso</a
        >
        <div>Komentar pertama</div>
      </div>
      <div class="comment" role="article" aria-label="Comment by Siti Aminah">
        <a class="author" role="link" href="https://www.facebook.com/siti.a"
          >Siti Aminah</a
        >
        <div>Komentar kedua</div>
      </div>
      <div class="comment" role="article" aria-label="Komentar oleh Andi Wijaya">
        <a class="author" role="link" href="https://www.facebook.com/andi.w"
          >Andi Wijaya</a
        >
        <div>Komentar ketiga</div>
      </div>
      <div class="comment" role="article" aria-label="Comment by Budi Santoso">
        <a class="author" role="link" href="https://www.facebook.com/budi.s"
          >Budi Santoso</a
        >
        <div>Komentar duplikat</div>
      </div>

      <div id="extra"></div>
      <button type="button" role="button" id="more">View more comments</button>
    </div>

    <div id="log"></div>

    <script>
      // Simulate inject scrape subset for offline check
      const nameMap = new Map();
      function addName(raw) {
        let name = String(raw || "")
          .replace(/\s+/g, " ")
          .trim();
        name = name.replace(/\s+[·•|].*$/, "").trim();
        if (name.length < 2) return;
        const k = name.toLowerCase();
        if (!nameMap.has(k)) nameMap.set(k, name);
      }
      function scrape() {
        document.querySelectorAll("[aria-label]").forEach((el) => {
          const label = el.getAttribute("aria-label") || "";
          const patterns = [
            /^Comment by (.+)$/i,
            /^Komentar oleh (.+)$/i,
            /^Reply by (.+)$/i,
            /^Balasan dari (.+)$/i,
          ];
          for (const re of patterns) {
            const m = label.match(re);
            if (m) {
              addName(m[1].split(/\s{2,}/)[0]);
              break;
            }
          }
        });
        return [...nameMap.values()];
      }

      document.getElementById("more").onclick = () => {
        const box = document.getElementById("extra");
        box.innerHTML += `
          <div class="comment" role="article" aria-label="Comment by Rina Putri">
            <a class="author" role="link" href="https://www.facebook.com/rina">Rina Putri</a>
            <div>Komentar tambahan</div>
          </div>`;
        log();
      };

      function log() {
        const names = scrape();
        document.getElementById("log").textContent =
          "Names (" + names.length + "):\n" + names.join("\n");
      }
      log();
    </script>
  </body>
</html>
